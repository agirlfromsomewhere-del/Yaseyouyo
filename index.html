<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12141a" />
    <meta name="description" content="Yaseyouyo — a strict, accessible TDEE and weight-goal tracker" />
    <!--
      GitHub Pages can't set real HTTP headers, so this meta tag is the
      only way to apply a CSP on static hosting. This app makes zero
      network requests of its own (all data is local IndexedDB), so the
      policy is locked down to same-origin only.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Yaseyouyo</title>
  </head>
  <body>
    <div id="announcer" aria-live="polite" aria-atomic="true" class="sr-only"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
